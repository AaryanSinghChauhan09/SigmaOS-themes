[package]
name = "sigmaos-theme-icons"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Team"]
license = "MIT OR Apache-2.0"
description = "SigmaOS icon theme pack"

[lib]
name = "sigmaos_theme_icons"
path = "lib.rs"

[[bin]]
name = "sigmaos-theme-icons"
path = "main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
